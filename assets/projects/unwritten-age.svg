<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 681" role="img" aria-labelledby="title desc">
  <title id="title">The Unwritten Age</title>
  <desc id="desc">A bronze-on-black title card for The Unwritten Age procedural browser RPG.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="76%"><stop offset="0" stop-color="#211b13"/><stop offset=".55" stop-color="#0d0d0e"/><stop offset="1" stop-color="#05060a"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff6e2"/><stop offset=".55" stop-color="#d9a441"/><stop offset="1" stop-color="#8a6524"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="681" fill="url(#bg)"/>
  <g fill="none" stroke="#d9a441" opacity=".22">
    <path d="M0 545 C170 440 280 590 450 490 S760 410 920 515 S1120 590 1280 465"/>
    <path d="M0 575 C180 470 290 620 480 520 S760 445 930 545 S1120 630 1280 500"/>
