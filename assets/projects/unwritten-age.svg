  <circle cx="640" cy="290" r="4" fill="#f0cf8a" filter="url(#glow)"/>
  <text x="640" y="205" text-anchor="middle" fill="#d9a441" font-family="Georgia,serif" font-size="17" letter-spacing="8">BEFORE HISTORY, MEMORY WAS LAW</text>
  <text x="640" y="315" text-anchor="middle" fill="url(#gold)" font-family="Georgia,serif" font-size="78" letter-spacing="3">THE UNWRITTEN AGE</text>
  <text x="640" y="365" text-anchor="middle" fill="#9d9382" font-family="Georgia,serif" font-size="19" letter-spacing="3">A PROCEDURAL BROWSER RPG · 30,000 YEARS BEFORE RECORDS</text>
  <text x="640" y="565" text-anchor="middle" fill="#d9a441" font-family="Georgia,serif" font-size="15" letter-spacing="5">CULTURES · BEASTS · ANCIENT SITES · ERASURE</text>
